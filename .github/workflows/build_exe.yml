name: Build txt2media.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build EXE (portable, sin instalacion, sin admin)
        run: |
          $icon = if (Test-Path "assets/icon.ico") { "--icon=assets/icon.ico" } else { "" }
          pyinstaller `
            --onefile `
            --noconsole `
            --name txt2media `
            --collect-all PySide6 `
            --collect-all edge_tts `
            --hidden-import pyttsx3 `
            --hidden-import keyring.backends.Windows `
            --hidden-import langdetect `
            --add-data "recursos;." `
            $icon `
            herramientas/compilar/main_exe.py
        shell: pwsh

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: txt2media-exe
          path: dist/txt2media.exe
          retention-days: 90

      - name: Crear ZIP para Python
        run: |
          $zip = "dist\txt2media_python.zip"
          $tmp = "dist\zip_tmp\txt2media"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item "herramientas\portable\ejecutar.bat" $tmp
          Copy-Item "txt2media.cmd"  $tmp
          Copy-Item "herramientas\portable\lanzar.pyw"   $tmp
          Copy-Item "pyproject.toml" $tmp
          Copy-Item "herramientas\compilar\main_exe.py" $tmp
          Copy-Item "src"            $tmp -Recurse
          if (Test-Path "assets") { Copy-Item "assets" $tmp -Recurse }
          if (Test-Path "recursos") { Copy-Item "recursos" $tmp -Recurse }
          Compress-Archive -Path "dist\zip_tmp\*" -DestinationPath $zip -Force
          Write-Host "ZIP creado: $zip"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-b${{ github.run_number }}
          name: "txt2media v1.0.1"
          body: |
            ## Dos formas de ejecutar

            ### Opción 1 — Sin instalar nada (recomendado)
            1. Descarga `txt2media.exe`
            2. Doble clic → la app abre directamente

            > No requiere Python ni permisos de administrador. Compatible con Windows 10/11 (64-bit).

            ### Opción 2 — Con Python instalado
            1. Descarga `txt2media_python.zip`
            2. Descomprime en cualquier carpeta
            3. Doble clic en `ejecutar.bat`

            > Instala las dependencias automáticamente en la primera ejecución.
          files: |
            dist/txt2media.exe
            dist/txt2media_python.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
