name: Build txt2media.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build EXE (portable, sin instalacion, sin admin)
        run: |
          $icon = if (Test-Path "assets/icon.ico") { "--icon=assets/icon.ico" } else { "" }
          pyinstaller `
            --onefile `
            --noconsole `
            --name txt2media `
            --collect-all PySide6 `
            --collect-all edge_tts `
            --hidden-import pyttsx3 `
            --hidden-import keyring.backends.Windows `
            --hidden-import langdetect `
            $icon `
            main_exe.py
        shell: pwsh

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: txt2media-exe
          path: dist/txt2media.exe
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-b${{ github.run_number }}
          name: "txt2media v1.0.1"
          body: |
            ## Descarga y abre — sin instalar nada

            1. Descarga `txt2media.exe`
            2. Doble clic
            3. La aplicación abre directamente

            No requiere Python, no requiere instalación, no requiere permisos de administrador.
            Compatible con Windows 10/11 (64-bit).
          files: dist/txt2media.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
