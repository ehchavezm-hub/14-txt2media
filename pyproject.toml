[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "txt2media"
version = "1.0.1"
description = "Conversor de documentos EPUB/PDF/DOCX/MD a PPTX/Audio/Video/DOCX/XLSX"
requires-python = ">=3.12"
license = "LicenseRef-Propietario-Uso-Interno"
authors = [{name = "COSAPI", email = "evolucion1@cosapi.com.pe"}]

dependencies = [
    "PySide6>=6.10.0",
    "pdfplumber>=0.11.4",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "markdown-it-py>=3.0.0",
    "Pillow>=11.0.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.12",
    "pyttsx3==2.90",
    "keyring>=25.4.0",
    "langdetect==1.0.9",
    "jsonschema>=4.23.0",
    "defusedxml>=0.7.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
# OCR para PDFs escaneados: requiere además el programa Tesseract instalado en Windows
ocr = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.1",
    "mypy>=1.13.0",
]

[project.scripts]
txt2media = "txt2media.cli.main:main"
txt2media-gui = "txt2media.ui.ventana_principal:lanzar_app"

[project.gui-scripts]
txt2media-app = "txt2media.ui.ventana_principal:lanzar_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
